onboarding = false
[ui]
agent_panel_sort = "priority"
pane_gaps = false

status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

# $agents_hidden is reported by the rachel.hide-agents plugin.
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
    { token = "$agents_hidden", dim = true },
  ],
  [
    "branch",
    "git_status",
  ],
]

[theme]
name = "terminal"
auto_switch = false
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[theme.custom]
accent = "lightred"
green = "lightgreen"
yellow = "lightyellow"
red = "lightred"
blue = "lightblue"
teal = "lightcyan"
peach = "lightyellow"
panel_bg = "#181818"
surface0 = "#181818"
active_row_bg = "#181818"

[keys]
last_pane = "prefix+backtick"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "rachel.tab-sync.toggle"
description = "sync typing to all panes in the tab"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "rachel.hide-agents.toggle"
description = "hide or show this workspace's agents"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "rachel.hide-agents.sort"
description = "switch agents order while agents are hidden"
